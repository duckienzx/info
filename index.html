<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fuzzy+Bubbles:wght@400;700&family=Molle:ital@1&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Bio - Duc Kien</title>

  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <link rel="stylesheet" href="./style.css" />

  <style>
    .nameLine{
      display:inline-flex;
      align-items:center;
      gap:10px;
      margin-top: 10px;
      margin-bottom: 5px;
    }
    .nameBig{
      font-family: "Molle", cursive;
      font-size: 52px;
      font-style: italic;
      color: #fff;
      letter-spacing: 1px;
      line-height: 1;
      text-shadow: 0 0 10px rgba(255,255,255,.25);
      margin: 0;
    }
    .verified-icon{
      color:#1d9bf0;
      font-size:24px;
      filter: drop-shadow(0 0 5px rgba(29,155,240,.5));
      transform: translateY(4px);
    }
    .play-circle svg { pointer-events: none; }
    .play-circle .icon-play { display: block; }
    .play-circle .icon-pause { display: none; }
    .play-circle.playing .icon-play { display: none; }
    .play-circle.playing .icon-pause { display: block; }
    
  

    /* Discord: Xanh Blurple đặc trưng */
    .appBtn.discord { background: rgba(88, 101, 242, 0.15); border: 1px solid rgba(88, 101, 242, 0.4); color: #5865F2; transition: all 0.3s ease; }
    .appBtn.discord:hover { background: #5865F2; color: #fff; box-shadow: 0 0 15px rgba(88, 101, 242, 0.6); border-color: #5865F2; }

    /* Facebook: Xanh dương nguyên bản */
    .appBtn.facebook { background: rgba(24, 119, 242, 0.15); border: 1px solid rgba(24, 119, 242, 0.4); color: #1877F2; transition: all 0.3s ease; }
    .appBtn.facebook:hover { background: #1877F2; color: #fff; box-shadow: 0 0 15px rgba(24, 119, 242, 0.6); border-color: #1877F2; }

    /* Riot Games: Đỏ Riot quyền lực */
    .appBtn.riot { background: rgba(235, 0, 41, 0.15); border: 1px solid rgba(235, 0, 41, 0.4); color: #ffffff; transition: all 0.3s ease; }
    .appBtn.riot:hover { background: #EB0029; color: #fff; box-shadow: 0 0 15px rgba(235, 0, 41, 0.6); border-color: #EB0029; }

    /* Instagram: TRÙM CUỐI GRADIENT */
    .appBtn.instagram { background: rgba(225, 48, 108, 0.15); border: 1px solid rgba(225, 48, 108, 0.4); color: #ffffff; transition: all 0.3s ease; }
    .appBtn.instagram:hover { 
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); 
      color: #fff; 
      box-shadow: 0 0 15px rgba(220, 39, 67, 0.6); 
      border-color: transparent;
    }

    /* TikTok: Nền đen, tỏa ánh sáng glitch Xanh - Đỏ */
    .appBtn.tiktok { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); color: #fff; transition: all 0.3s ease; }
    .appBtn.tiktok:hover { 
      background: #000; 
      color: #fff; 
      box-shadow: -2px 2px 10px #69C9D0, 2px -2px 10px #EE1D52; 
      border-color: #000; 
    }

    /* Web: Xanh ngọc mượt mà */
    .appBtn.web { background: rgba(14, 165, 233, 0.15); border: 1px solid rgba(14, 165, 233, 0.4); color: #0ea5e9; transition: all 0.3s ease; }
    .appBtn.web:hover { background: #0ea5e9; color: #fff; box-shadow: 0 0 15px rgba(14, 165, 233, 0.6); border-color: #0ea5e9; }

    #oneko{ transition: opacity .2s ease, filter .2s ease; }
    body.modal-open #oneko{
      opacity: 0.15;
      filter: blur(2px);
    }
  </style>
</head>

<body>
  <div class="stage">

    <section class="screen" id="screen1">
      <div class="window">
        <div class="titlebar">
          <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
        </div>

        <div class="content1" id="goToCard">
          <div class="heart" aria-hidden="true">
            <div class="row r1"><span class="bar"></span><span class="bar"></span></div>
            <div class="row r2"><span class="bar"></span><span class="bar"></span></div>
            <div class="row r3"><span class="bar"></span></div>
            <div class="row r4"><span class="bar"></span></div>
            <div class="row r5"><span class="bar"></span></div>
            <div class="row r6"><span class="bar"></span></div>
            <div class="row r7"><span class="bar"></span></div>
            <div class="row r8"><span class="bar"></span></div>
          </div>

          <div class="sysbox">
            <div class="syshead">
              <span class="sysdot"></span>
              <span class="systitle">SYSTEM INFO</span>
              <span class="sysstatus">● LIVE</span>
            </div>
            <div class="sysgrid">
              <div class="k">Name</div><div class="v">Duc Kien</div>
              <div class="k">IP</div><div class="v" id="ip">Loading...</div>
              <div class="k">System</div><div class="v" id="sys">Loading...</div>
            </div>
            <div class="sysfoot">Bio loaded ✓</div>
          </div>

          <div class="enter">Press Enter To Continue<span class="cursor">▌</span></div>
        </div>
      </div>
    </section>

    <section class="screen hidden" id="screen2">
      <div class="bg2" id="bg2">
        <video autoplay muted loop playsinline id="bgVideo" poster="./assets/bg.jpg">
          <source src="back.mp4" type="video/mp4" />
        </video>
      </div>

      <div class="tiltWrap">
        <div class="panel" id="panel">

          <div class="profileTheme">
            <div class="profileBanner" id="profileBanner"></div>
          </div>

          <div class="dHeader">
            <div class="dAvatarWrap">
              <img class="dAvatar" id="avatar" alt="avatar" />
              <div class="decorHolder" id="decorHolder" aria-hidden="true" style="pointer-events:none;"></div>
            </div>
            <div class="dNameBlock">
              <div class="dDisplayName">Duc Kien</div>
            </div>
          </div>

          <div class="status-card">
            <div class="status-user-info">
              <img class="status-mini-avatar" id="avatar2" alt="" />
              <div class="status-username">kjen_whje</div>
            </div>
            <div class="status-box">
              Darwin
            </div>
          </div>

          <div class="bubble2" id="discordStatus">
            Đang tải trạng thái Discord...
          </div>

          <div class="spotify-player">
            <audio id="audio" src=""></audio>
            <div class="songTitleWrap">
              <span id="songTitle">Đang tải danh sách nhạc...</span>
            </div>
            <div class="controls-row">
              <button type="button" class="s-btn dim-btn" id="shuffleBtn"><iconify-icon icon="ph:shuffle-bold"></iconify-icon></button>
              <button type="button" class="s-btn" id="prevBtn"><iconify-icon icon="ph:skip-back-fill"></iconify-icon></button>
              <button type="button" class="play-circle" id="playBtn">
                <svg class="icon-play" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M8 5.14v14l11-7l-11-7Z"/></svg>
                <svg class="icon-pause" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="currentColor" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
              </button>
              <button type="button" class="s-btn" id="nextBtn"><iconify-icon icon="ph:skip-forward-fill"></iconify-icon></button>
              <button type="button" class="s-btn dim-btn" id="loopBtn"><iconify-icon id="loopIcon" icon="ph:repeat-bold"></iconify-icon></button>
            </div>
            <div class="time-row">
              <span id="currTime">0:00</span>
              <div class="progress-area" id="progressArea">
                <div class="progress-bar" id="progressBar"></div>
              </div>
              <span id="durTime">0:00</span>
            </div>
          </div>

          <div class="links2">
            <a class="appBtn discord" href="https://discord.com/users/1141378644070109285" target="_blank" rel="noreferrer">
              <iconify-icon icon="fa6-brands:discord"></iconify-icon>
            </a>
            <a class="appBtn facebook" href="https://www.facebook.com/duckien.lowkey" target="_blank" rel="noreferrer">
              <iconify-icon icon="fa6-brands:facebook"></iconify-icon>
            </a>
            <button type="button" class="appBtn riot" id="valoBtn">
              <iconify-icon icon="simple-icons:riotgames"></iconify-icon>
            </button>
            <a class="appBtn instagram" href="https://www.instagram.com/duckie.wx/" target="_blank" rel="noreferrer">
              <iconify-icon icon="fa6-brands:instagram"></iconify-icon>
            </a>
            <a class="appBtn tiktok" href="https://www.tiktok.com/@kjenwz" target="_blank" rel="noreferrer">
              <iconify-icon icon="fa6-brands:tiktok"></iconify-icon>
            </a>
            <a class="appBtn web" href="#" target="_blank" rel="noreferrer">
              <iconify-icon icon="mdi:web"></iconify-icon>
            </a>
          </div>

          <div class="visitorRow">
            <iconify-icon class="eyeIcon" icon="mdi:eye-outline"></iconify-icon>
            <span class="visitorText" id="visits">...</span>
          </div>

        </div>
      </div>
    </section>

    <div class="valoModal hidden" id="valoModal">
      <div class="valoCard">
        <div class="valoTop">
          <div class="valoTitle"><iconify-icon icon="simple-icons:riotgames"></iconify-icon> Riot ID</div>
          <button type="button" class="valoClose" id="valoClose">✕</button>
        </div>
        <div class="valoBody">
          <div class="valoLabel">Riot Username</div>
          <div class="valoUser">Darwin#2000</div>
          <div class="valoHint">hay ket ban toi va toi se ganh nang cho ban =)))</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const AVATAR_URL = "csm.gif";
    const DECOR_LIST = [
      "https://cdn.discordapp.com/avatar-decoration-presets/a_4ecf139a79f8ef0045e2346d2ce6e5b8.png?size=256",
      "https://cdn.discordapp.com/avatar-decoration-presets/a_3c97a2d37f433a7913a1c7b7a735d000.png?size=256",
      "https://cdn.discordapp.com/avatar-decoration-presets/a_98555e40cc6802bd3a4fed906af1d992.png?size=256",
      "https://cdn.discordapp.com/avatar-decoration-presets/a_af21a730b99ed414e520decfea99aa79.png?size=256",
      "https://cdn.discordapp.com/avatar-decoration-presets/a_22166be7fd3b6b851108eb93ca9200a9.png?size=256",
      "https://cdn.discordapp.com/avatar-decoration-presets/a_7f44d538ec830f479605f7bf8720afda.png?size=160",
      "https://cdn.discordapp.com/avatar-decoration-presets/a_322c506cac670b3fc9915c44d1bcbe47.png?size=160",
      "https://cdn.discordapp.com/avatar-decoration-presets/a_741750ac1c9091a58059be33590c2821.png?size=160",
      "https://cdn.discordapp.com/avatar-decoration-presets/a_f081c6b2c85c5ebe5df42f1c24d45bb5.png?size=160"
    ];

    document.getElementById("avatar").src = AVATAR_URL;
    document.getElementById("avatar2").src = AVATAR_URL;

    function setDecor(url){
      const holder = document.getElementById("decorHolder");
      holder.innerHTML = "";
      if(!url) return;
      const img = document.createElement("img");
      img.className = "decor";
      img.src = url;
      holder.appendChild(img);
    }
    setDecor(DECOR_LIST[Math.floor(Math.random() * DECOR_LIST.length)]);

    const playlist = [
      { title: "Dự báo thời tiết hôm nay mưa", src: "nhac.mp3" },
      { title: "Chấm xám - SIVAN", src: "nhac2.mp3" },
      { title: "Hngle - Buông", src: "nhac3.mp3" },
      { title: "VSTRA - Ai Ngoài Anh", src: "nhac4.mp3" },
      { title: "Hngle - KHÔNG BUÔNG ft. Ari", src: "nhac5.mp3" },
      { title: "obito - 'dạo này'", src: "nhac6.mp3" },
      { title: "kidsai , VSTRA - NGÂY THER", src: "nhac7.mp3" },
      { title: "Madihu - Em Đâu Cần (Feat. tlinh)", src: "nhac8.mp3" },
      { title: "Madihu - Không Còn Em", src: "nhac9.mp3" },

    ];
    let songIndex = 0;

    const audio = document.getElementById("audio");
    const songTitle = document.getElementById("songTitle");
    const playBtn = document.getElementById("playBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const shuffleBtn = document.getElementById("shuffleBtn");
    const loopBtn = document.getElementById("loopBtn");
    const loopIcon = document.getElementById("loopIcon");
    const progressBar = document.getElementById("progressBar");
    const progressArea = document.getElementById("progressArea");
    const currTime = document.getElementById("currTime");
    const durTime = document.getElementById("durTime");

    let isShuffle = false;
    let loopState = 1;

    function loadSong(song) {
      songTitle.innerText = song.title;
      audio.src = song.src;
    }
    loadSong(playlist[songIndex]);

    function formatTime(s) {
      if (isNaN(s)) return "0:00";
      const min = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return min + ":" + (sec < 10 ? "0" + sec : sec);
    }

    audio.addEventListener("loadedmetadata", () => {
      durTime.innerText = formatTime(audio.duration);
    });

    function playMusic() { audio.play(); playBtn.classList.add("playing"); }
    function pauseMusic() { audio.pause(); playBtn.classList.remove("playing"); }

    playBtn.onclick = () => { if (audio.paused) playMusic(); else pauseMusic(); };

    function nextSong() {
      songIndex++;
      if (songIndex > playlist.length - 1) songIndex = 0;
      loadSong(playlist[songIndex]);
      playMusic();
    }

    function prevSong() {
      songIndex--;
      if (songIndex < 0) songIndex = playlist.length - 1;
      loadSong(playlist[songIndex]);
      playMusic();
    }

    nextBtn.onclick = () => nextSong();
    prevBtn.onclick = () => prevSong();

    audio.onended = () => {
      if (loopState === 2) { playMusic(); }
      else if (loopState === 1) { nextSong(); }
      else {
        if (songIndex === playlist.length - 1) pauseMusic();
        else nextSong();
      }
    };

    audio.onpause = () => playBtn.classList.remove("playing");
    audio.onplay = () => playBtn.classList.add("playing");

    shuffleBtn.onclick = () => {
      isShuffle = !isShuffle;
      if(isShuffle) { shuffleBtn.classList.add("active-btn"); shuffleBtn.classList.remove("dim-btn"); }
      else { shuffleBtn.classList.remove("active-btn"); shuffleBtn.classList.add("dim-btn"); }
    };

    loopBtn.onclick = () => {
      loopState = (loopState + 1) % 3;
      if (loopState === 0) {
        loopBtn.classList.remove("active-btn");
        loopBtn.classList.add("dim-btn");
        loopIcon.setAttribute("icon", "ph:repeat-bold");
      } else if (loopState === 1) {
        loopBtn.classList.add("active-btn");
        loopBtn.classList.remove("dim-btn");
        loopIcon.setAttribute("icon", "ph:repeat-bold");
      } else if (loopState === 2) {
        loopBtn.classList.add("active-btn");
        loopBtn.classList.remove("dim-btn");
        loopIcon.setAttribute("icon", "ph:repeat-once-bold");
      }
    };

    audio.ontimeupdate = () => {
      if(audio.duration) {
        const p = (audio.currentTime / audio.duration) * 100;
        progressBar.style.width = p + "%";
        currTime.innerText = formatTime(audio.currentTime);
      }
    };

    progressArea.onclick = (e) => {
      const w = progressArea.clientWidth;
      const x = e.offsetX;
      const d = audio.duration;
      if (!d) return;
      audio.currentTime = (x / w) * d;
    };

    let wasPlayingBeforeHide = false;
    document.addEventListener("visibilitychange", () => {
      if (document.hidden) {
        if (!audio.paused) { wasPlayingBeforeHide = true; pauseMusic(); }
        else { wasPlayingBeforeHide = false; }
      } else {
        if (wasPlayingBeforeHide) { playMusic(); }
      }
    });

    const bgVideo = document.getElementById("bgVideo");
    bgVideo.addEventListener("canplay", () => bgVideo.play().catch(()=>{}));

    fetch("https://api.ipify.org?format=json")
      .then(r => r.json())
      .then(d => (document.getElementById("ip").textContent = d.ip))
      .catch(() => (document.getElementById("ip").textContent = "Unknown"));

    const ua = navigator.userAgent;
    let os = "Unknown";
    if (ua.includes("Windows")) os = "Windows 10/11";
    else if (ua.includes("Mac")) os = "macOS";
    else if (ua.includes("Android")) os = "Android";
    else if (ua.includes("iPhone") || ua.includes("iPad")) os = "iOS";
    else if (ua.includes("Linux")) os = "Linux";
    document.getElementById("sys").textContent = os;

    const s1 = document.getElementById("screen1");
    const s2 = document.getElementById("screen2");
    const go = document.getElementById("goToCard");

    go.onclick = () => {
      s1.classList.add("hidden");
      s2.classList.remove("hidden");
      playMusic();
      updateVisitorCount();
      loadDiscordStatus(); 
    };

    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !s1.classList.contains("hidden")) go.click();
    });

    
    const vBtn = document.getElementById("valoBtn");
    const vModal = document.getElementById("valoModal");
    const vClose = document.getElementById("valoClose");

    function openModal(){
      vModal.classList.remove("hidden");
      document.body.classList.add("modal-open");
    }
    function closeModal(){
      vModal.classList.add("hidden");
      document.body.classList.remove("modal-open");
    }

    vBtn.onclick = openModal;
    vClose.onclick = closeModal;

    vModal.addEventListener("click", (e) => {
      if (e.target === vModal) closeModal();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeModal();
    });

    const VISITOR_API = "https://sweet-sound-4842.duckien5527.workers.dev/";
    function updateVisitorCount() {
      fetch(VISITOR_API)
        .then(r => r.json())
        .then(d => {
          const el = document.getElementById("visits");
          if (el) el.textContent = d.count;
        })
        .catch(() => {
          const el = document.getElementById("visits");
          if (el) el.textContent = "0";
        });
    }

    const DISCORD_ID = "1141378644070109285";

    function statusText(st){
      if (st === "online") return "🟢 Online";
      if (st === "idle")   return "🌙 Chờ";
      if (st === "dnd")    return "⛔ Vui lòng không làm phiền";
      return "⚫ Offline";
    }

    async function loadDiscordStatus(){
      const el = document.getElementById("discordStatus");
      if (!el) return;

      try{
        const res = await fetch("https://api.lanyard.rest/v1/users/" + DISCORD_ID);
        const json = await res.json();

        if (!json || !json.success || !json.data){
          el.textContent = "Không lấy được trạng thái Discord";
          return;
        }

        const data = json.data;
        let statusLines = [];
        
        statusLines.push(statusText(data.discord_status));

        const acts = Array.isArray(data.activities) ? data.activities : [];
        const game = acts.find(a => a && a.type === 0 && a.name); 
        if (game) {
          statusLines.push("🎮 Playing <b>" + game.name + "</b>");
        }

        if (data.spotify && data.spotify.song) {
          statusLines.push("🎵 Listening to <b>" + data.spotify.song + "</b> - " + data.spotify.artist);
        }

        el.innerHTML = statusLines.join("<br>");
      } catch(e){
        el.textContent = "Status unavailable";
      }
    }

    setInterval(() => {
      if (!s2.classList.contains("hidden")) loadDiscordStatus();
    }, 15000);

    const BANNER_LIST = [
      "https://cdn.discordapp.com/banners/1141378644070109285/a_df42b3a05149fe8c27c05709d6dc36fa.gif?size=1024"
    ];

    function setBanner(url){
      const el = document.getElementById("profileBanner");
      if(!el) return;
      el.style.backgroundImage = "linear-gradient(to bottom, transparent 60%, rgba(0,0,0,.45)), url('" + url + "')";
    }

    const randomBanner = BANNER_LIST[Math.floor(Math.random() * BANNER_LIST.length)];
    setBanner(randomBanner);
    
    const titleText = ["@Duc_Kien ", "Welcome to my Bio! ", "Have a good day! "]; // Bạn có thể sửa hoặc thêm chữ ở đây
    let titleIndex = 0;
    let charIndex = 0;
    let isDeletingTitle = false;

    function typeWriterTitle() {
      const currentWord = titleText[titleIndex];
      
      // Hiển thị chữ kèm theo con trỏ chuột ảo |
      if (isDeletingTitle) {
        document.title = currentWord.substring(0, charIndex) + " |";
        charIndex--;
      } else {
        document.title = currentWord.substring(0, charIndex) + " |";
        charIndex++;
      }

      // Tốc độ gõ và xóa (Tính bằng mili-giây)
      let typeSpeed = isDeletingTitle ? 100 : 250; // Xóa nhanh hơn gõ

      // Nếu đã gõ xong toàn bộ chữ -> Đợi 2 giây rồi bắt đầu xóa
      if (!isDeletingTitle && charIndex === currentWord.length) {
        typeSpeed = 2000; 
        isDeletingTitle = true;
      } 
      // Nếu đã xóa sạch chữ -> Chuyển sang câu tiếp theo và bắt đầu gõ lại
      else if (isDeletingTitle && charIndex === 0) {
        isDeletingTitle = false;
        titleIndex = (titleIndex + 1) % titleText.length;
        typeSpeed = 500; // Đợi nửa giây trước khi gõ câu mới
      }

      setTimeout(typeWriterTitle, typeSpeed);
    }

    // Bắt đầu chạy hiệu ứng
    typeWriterTitle();
  </script>

  <script src="https://cdn.jsdelivr.net/gh/adryd325/oneko.js@main/oneko.js"
          data-cat="https://raw.githubusercontent.com/adryd325/oneko.js/main/oneko.gif"
          defer></script>
</body>
</html>
